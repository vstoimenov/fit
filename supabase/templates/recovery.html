<!doctype html>
<html lang="bg">
  <body
    style="
      margin: 0;
      padding: 24px;
      background: #f4f3f0;
      font-family: Manrope, Arial, sans-serif;
      color: #111111;
    "
  >
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
      <tr>
        <td align="center">
          <table
            role="presentation"
            width="100%"
            cellpadding="0"
            cellspacing="0"
            style="max-width: 480px; background: #ffffff; border-radius: 16px; padding: 28px"
          >
            <tr>
              <td>
                <p style="margin: 0 0 4px; font-weight: 800; font-size: 20px">I AM STRONG</p>
                <h1 style="margin: 16px 0 8px; font-size: 22px">Нова парола</h1>
                <p style="margin: 0 0 20px; line-height: 1.5">
                  Поиска нова парола за профила си. Натисни бутона и избери нова. Линкът важи един
                  час и работи от всеки браузър и телефон.
                </p>
                <p style="margin: 0 0 24px">
                  <a
                    href="{{ .SiteURL }}/auth/callback?token_hash={{ .TokenHash }}&type=recovery&next=/reset-password"
                    style="
                      display: inline-block;
                      background: #111111;
                      color: #ffffff;
                      text-decoration: none;
                      font-weight: 700;
                      padding: 14px 22px;
                      border-radius: 999px;
                    "
                  >
                    Избери нова парола
                  </a>
                </p>
                <p style="margin: 0; font-size: 13px; color: #5c5a55; line-height: 1.5">
                  Ако не си искала нова парола, просто игнорирай този имейл. Паролата ти остава
                  същата.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
